runtime: python312

automatic_scaling:
  max_instances: 1

entrypoint: gunicorn -b :$PORT -w 2 main:app

# uv only becomes the buildpack's default package manager at Python 3.14+;
# opt in explicitly here rather than waiting for a runtime bump to get it.
build_env_variables:
  GOOGLE_PYTHON_PACKAGE_MANAGER: "uv"

handlers:
- url: /css
  static_dir: static/css
  expiration: "1d"
  secure: always

- url: /images
  static_dir: static/images
  expiration: "7d"
  secure: always

- url: /fonts
  static_dir: static/fonts
  expiration: "7d"
  secure: always

- url: /screenshots
  static_dir: static/screenshots
  expiration: "7d"
  secure: always

- url: /js
  static_dir: static/js
  secure: always

- url: /favicon.ico
  static_files: static/images/favicon.ico
  upload: static/images/favicon.ico
  expiration: "7d"
  secure: always

runtime: python312
entrypoint: gunicorn -b :$PORT main:app

handlers:
- url: /css
  static_dir: static/css
  expiration: "1d"
  secure: always

- url: /images
  static_dir: static/images
  expiration: "7d"
  secure: always

- url: /fonts
  static_dir: static/fonts
  expiration: "7d"
  secure: always

- url: /screenshots
  static_dir: static/screenshots
  expiration: "7d"
  secure: always

- url: /js
  static_dir: static/js
  secure: always

- url: /favicon.ico
  static_files: static/images/favicon.ico
  upload: static/images/favicon.ico
  expiration: "7d"
  secure: always

- url: /.*
  script: auto
  secure: always

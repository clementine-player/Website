# Keeps the website's translations in step with Transifex (the "website" resource of
# davidsansome/clementine):
#   - push: when the pages' English text changes on master, regenerates locale/django.pot from
#     the templates and data.py (make pot) and sends it to Transifex for the translators
#   - pull: every Thursday, brings the translations back, commits them and deploys the site
# Run by hand, it does both, push first; with "Push translations" ticked, the push sends the
# repository's translations too.
#
# Needs two secrets: TX_TOKEN, a Transifex API token, and TX_KEY, the private half of a deploy key
# with write access, which pushes the translations to master. The ruleset protecting master must
# let deploy keys bypass it: the pull pushes straight to master, without a pull request or checks.
name: translations
on:
  push:
    branches: [master]
    paths:
      - 'www.clementine-player.org/*.html'
      - 'www.clementine-player.org/*.py'
      - '.github/workflows/translations.yml'
  schedule:
    - cron: '23 0 * * 4'
  workflow_dispatch:
    inputs:
      push_translations:
        description: "Push translations: send the repository's translations to Transifex too"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push_strings:
    name: Push strings to Transifex
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}
      TX_VERSION: 1.6.17
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      # django-admin makemessages, which make pot runs, uses gettext's xgettext.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install Django
        run: uv pip install --system Django
      - name: Install the Transifex client
        run: |
          mkdir -p "$RUNNER_TEMP/tx"
          curl -fsSL "https://github.com/transifex/cli/releases/download/v$TX_VERSION/tx-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tx" tx
          echo "$RUNNER_TEMP/tx" >> "$GITHUB_PATH"
      # The committed django.pot isn't kept up to date, so it's made afresh from the pages.
      - name: Extract the English strings
        working-directory: www.clementine-player.org
        run: make pot
      - name: tx init
        working-directory: www.clementine-player.org
        run: tx init
      - name: tx config
        working-directory: www.clementine-player.org
        run: tx add --organization davidsansome --project clementine --resource website --file-filter 'locale/<lang>.po' --type PO locale/django.pot
      # --silent prints errors whole: otherwise the client cuts every line to 80 columns in CI,
      # which hides why Transifex refused a file.
      - name: Push the English strings
        working-directory: www.clementine-player.org
        run: tx push --source --silent
      # Only by hand: for translations made or fixed in the repository, which the next pull
      # would otherwise replace with Transifex's.
      - name: Push the translations
        if: inputs.push_translations
        working-directory: www.clementine-player.org
        run: tx push --translation --skip --silent

  pull_translations:
    name: Pull translations from Transifex
    needs: push_strings
    # After the push when run by hand, but on its own every Thursday.
    if: >-
      always() && github.event_name != 'push' && needs.push_strings.result != 'failure'
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:jammy
    steps:
      - uses: supplypike/setup-bin@v3
        with:
          uri: https://github.com/transifex/cli/releases/download/v1.6.7/tx-linux-amd64.tar.gz
          name: tx
          version: 1.6.7
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y
          git
          curl
          openssh-client
      # Checked out with the deploy key, so the push below can bypass master's ruleset, and runs
      # www.yml on the new commit to deploy the site, as a push with the workflow's own token
      # does neither.
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: master
          ssh-key: ${{ secrets.TX_KEY }}
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: tx init
        working-directory: www.clementine-player.org
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx init
      - name: tx config
        working-directory: www.clementine-player.org
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx add --organization davidsansome --project clementine --resource website --file-filter 'locale/<lang>.po' --type PO locale/django.pot
      - name: tx pull
        working-directory: www.clementine-player.org
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx pull -f -a
      - name: git add
        run: git add www.clementine-player.org/locale/*.po
      - name: git commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Translations are up to date."
          else
            git -c 'user.name=Clementine Buildbot' -c 'user.email=buildbot@clementine-player.org' commit -m 'Automatic merge of translations from Transifex'
            git push origin HEAD:master
          fi

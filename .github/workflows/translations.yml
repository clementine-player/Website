name: translations
on:
  schedule:
    - cron: '23 0 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  pull_translations:
    name: Pull translations from Transifex
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:jammy
    steps:
      - uses: supplypike/setup-bin@v3
        with:
          uri: https://github.com/transifex/cli/releases/download/v1.6.7/tx-linux-amd64.tar.gz
          name: tx
          version: 1.6.7
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y
          git
          curl
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Switch to master
        run: git checkout master
      - name: tx init
        working-directory: www.clementine-player.org
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx init
      - name: tx config
        working-directory: www.clementine-player.org
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx add --organization davidsansome --project clementine --resource website --file-filter 'locale/<lang>.po' --type PO locale/django.pot
      - name: tx pull
        working-directory: www.clementine-player.org
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx pull -f -a
      - name: git add
        run: git add www.clementine-player.org/locale/*.po
      - name: git commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -c 'user.name=Clementine Buildbot' -c 'user.email=buildbot@clementine-player.org' commit -m 'Automatic merge of translations from Transifex'
            git push origin master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A GITHUB_TOKEN-authenticated push doesn't trigger other workflows'
      # `on: push` events (GitHub's anti-recursion protection), so trigger
      # the site deploy explicitly rather than relying on www.yml's push
      # trigger to fire on its own.
      - name: Trigger website deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/www.yml/dispatches" \
            -d '{"ref":"master"}'

# Runs on every pull request, rather than only those that change the paths
# below, because build-and-boot is a required check: a pull request that
# didn't start it, such as a Dependabot update to another workflow, could
# never merge. The job is skipped, which counts as passing, when none of them
# changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2.8.0
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Check what changed
        id: diff
        run: |
          # translations.yml's push job runs make pot, which this builds too.
          if git diff --quiet HEAD^1 HEAD -- \
              www.clementine-player.org \
              .github/workflows/www-ci.yml \
              .github/workflows/translations.yml; then
            echo relevant=false >> "$GITHUB_OUTPUT"
          else
            echo relevant=true >> "$GITHUB_OUTPUT"
          fi

  build-and-boot:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python dependencies
        working-directory: www.clementine-player.org
        run: uv pip install --system -r requirements.txt Django
      - name: Build (translations + CSS)
        working-directory: www.clementine-player.org
        run: make
      - name: Smoke test (boot the app, hit every route)
        working-directory: www.clementine-player.org
        env:
          # Skips main.py's Secret Manager fallback, which needs real GCP
          # credentials CI doesn't have.
          GITHUB_TOKEN: dummy-token-for-ci
          # Shadows google.cloud.datastore with an in-memory fake (see
          # tests/fakes/google/cloud/datastore.py) for the same reason.
          PYTHONPATH: tests/fakes
        run: python3 tests/smoke_test.py

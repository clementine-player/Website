on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - name: Install dependencies
        run: apk --no-cache add py3-django make openjdk17-jre-headless gettext
      - name: checkout
        uses: actions/checkout@v2
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: clementine-web
          workload_identity_provider: projects/460637942860/locations/global/workloadIdentityPools/github-actions/providers/website-repo
          service_account: github-deploy@clementine-web.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: build
        working-directory: www.clementine-player.org
        run: make
      - name: Deploy WWW
        working-directory: www.clementine-player.org
        # --no-promote: land as a new version without shifting traffic to it.
        # Promoting is a separate, deliberate step (see the migration plan's
        # rollout section) so a merge can never make an unverified version live.
        run: gcloud app deploy app.yaml --no-promote --quiet

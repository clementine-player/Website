# Runs on every pull request, rather than only those that change the paths
# below, because build-and-boot is a required check: a pull request that
# didn't start it, such as a Dependabot update to another workflow, could
# never merge. The job is skipped, which counts as passing, when none of them
# changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2.8.0
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Check what changed
        id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- \
              data.clementine-player.org \
              .github/workflows/data-ci.yml; then
            echo relevant=false >> "$GITHUB_OUTPUT"
          else
            echo relevant=true >> "$GITHUB_OUTPUT"
          fi

  build-and-boot:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.8.0
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6.8.0
      - name: Install Python dependencies
        working-directory: data.clementine-player.org
        run: uv pip install --system -r requirements.txt
      # The smoke test runs against fakes of Google's libraries, which accept
      # things the real ones refuse when the module loads: a StringProperty
      # with indexed=False took the site down. models.py needs no credentials
      # to load, so load it with the real google-cloud-ndb too.
      - name: Load the models with the real ndb
        working-directory: data.clementine-player.org
        run: python3 -c "import models"
      - name: Smoke test (boot the app, hit every route)
        working-directory: data.clementine-player.org
        env:
          # Shadows google.cloud.ndb and google.cloud.tasks_v2 with
          # in-memory fakes (see tests/fakes/google/cloud/) so this doesn't
          # need real GCP credentials or network access.
          PYTHONPATH: tests/fakes
        run: python3 tests/smoke_test.py

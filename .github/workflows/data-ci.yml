on:
  pull_request:
    paths:
      - 'data.clementine-player.org/**'
      - '.github/workflows/data-ci.yml'

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python dependencies
        working-directory: data.clementine-player.org
        run: uv pip install --system -r requirements.txt
      # The smoke test runs against fakes of Google's libraries, which accept
      # things the real ones refuse when the module loads: a StringProperty
      # with indexed=False took the site down. models.py needs no credentials
      # to load, so load it with the real google-cloud-ndb too.
      - name: Load the models with the real ndb
        working-directory: data.clementine-player.org
        run: python3 -c "import models"
      - name: Smoke test (boot the app, hit every route)
        working-directory: data.clementine-player.org
        env:
          # Shadows google.cloud.ndb and google.cloud.tasks_v2 with
          # in-memory fakes (see tests/fakes/google/cloud/) so this doesn't
          # need real GCP credentials or network access.
          PYTHONPATH: tests/fakes
        run: python3 tests/smoke_test.py

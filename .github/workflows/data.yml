on:
  push:
    branches:
      - master
    paths:
      - 'data.clementine-player.org/**'
      - '.github/workflows/data.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: clementine-data
          workload_identity_provider: projects/611551928920/locations/global/workloadIdentityPools/github-actions/providers/website-repo
          service_account: github-deploy@clementine-data.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      # Before the app, so a version that needs a new index finds it
      # already building. Like cron.yaml, index.yaml is app-wide. This only
      # adds indexes: ones dropped from the file stay until removed by hand
      # with `gcloud datastore indexes cleanup index.yaml`. Needs
      # roles/datastore.indexAdmin on the deploying service account.
      - name: Deploy Datastore indexes
        working-directory: data.clementine-player.org
        run: gcloud app deploy index.yaml --quiet
      - name: Deploy data.clementine-player.org
        working-directory: data.clementine-player.org
        run: gcloud app deploy app.yaml --quiet
      - name: Deploy cron schedule
        working-directory: data.clementine-player.org
        # cron.yaml is app-wide rather than per-version, and cron always
        # calls whichever version is serving default traffic.
        run: gcloud app deploy cron.yaml --quiet

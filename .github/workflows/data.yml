on:
  push:
    branches:
      - master
    paths:
      - 'data.clementine-player.org/**'
      - '.github/workflows/data.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: clementine-data
          workload_identity_provider: projects/611551928920/locations/global/workloadIdentityPools/github-actions/providers/website-repo
          service_account: github-deploy@clementine-data.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy data.clementine-player.org
        working-directory: data.clementine-player.org
        # --no-promote: land as a new version without shifting traffic to it.
        # Promoting is a separate, deliberate step (see the migration plan's
        # rollout section) so a merge can never make an unverified version live.
        run: gcloud app deploy app.yaml --no-promote --quiet
      - name: Deploy cron schedule
        working-directory: data.clementine-player.org
        # Unlike app.yaml, cron.yaml is app-wide rather than per-version, so
        # this takes effect immediately regardless of --no-promote above, and
        # cron always calls whichever version is serving default traffic.
        # Its handlers must therefore exist on both the live version and
        # the one being rolled out.
        run: gcloud app deploy cron.yaml --quiet

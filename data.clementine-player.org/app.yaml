runtime: python312
entrypoint: gunicorn -b :$PORT -w 2 main:app
build_env_variables:
  GOOGLE_PYTHON_PACKAGE_MANAGER: "uv"
env_variables:
  # Must match the App Engine app's actual region -- confirm with:
  #   gcloud app describe --project=clementine-data --format='value(locationId)'
  TASKS_LOCATION: "us-central"

handlers:
- url: /favicon.ico
  static_files: static/images/favicon.ico
  upload: static/images/favicon.ico
